<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CF6"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B48D6"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- 对话气泡：圆角主体 -->
  <rect x="56" y="72" width="400" height="312" rx="146" fill="url(#bubble)"/>
  <!-- 气泡尾巴：向左下扬起 -->
  <path d="M132 356 L232 368 L156 464 Z" fill="url(#tail)"/>

  <!-- 缪斯火花：四角星，居中偏上 -->
  <path d="M256 128
           C 264 176, 280 192, 328 200
           C 280 208, 264 224, 256 272
           C 248 224, 232 208, 184 200
           C 232 192, 248 176, 256 128 Z"
        fill="#FFFFFF"/>
  <!-- 旁星：小四角星，右上 -->
  <path d="M376 140
           C 380 160, 388 168, 408 172
           C 388 176, 380 184, 376 204
           C 372 184, 364 176, 344 172
           C 364 168, 372 160, 376 140 Z"
        fill="#FFD34D"/>

  <!-- 输入指示点：三个白点（AI 正在想） -->
  <circle cx="196" cy="322" r="14" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="250" cy="322" r="14" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="304" cy="322" r="14" fill="#FFFFFF" opacity="0.55"/>
</svg>
